name: Deploy status dashboard

# Builds the static adaptor-status dashboard (pnpm specs site) and publishes it
# to GitHub Pages. Runs on every push to main (specs changed → dashboard updates),
# on a weekly schedule (so the staleness clock re-evaluates without a push), and
# on demand. Enable once in Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — refresh the "stale" bucket as the clock advances.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard
        run: pnpm specs site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
