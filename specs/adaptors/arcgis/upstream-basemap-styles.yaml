  /sessions/start:
    get:
      operationId: sessionsStartGet
      tags:
      - sessions
      description: |
        The `/sessions/start` endpoint starts a basemap session and returns the values for the `startTime`, `endTime`, `styleFamily`, and `sessionToken`.

        The general steps to start and manage a session are:
        1. Set the `styleFamily` parameter to retrieve either `arcgis` or `open` styles.
        2. Supply an access token that has
        the `premium:user:basemaps` privilege either in the `token` parameter or
        in the request header.
        3. Display a basemap using the `sessionToken` string returned in the response.
        4. Track when the session will expire by using the `startTime` and `endTime` values that are also returned in the response.

        If you need to continue accessing basemaps beyond the end of the session,
        start a new basemap session before the `endTime` has elapsed using your
        original access token.

        **Note**:
        - Basemap sesions are only available for developers with an _ArcGIS Location Platform_ account.
        - A session token can access either styles from the ArcGIS or Open style families.
        - Each session token is valid for up to 12 hours and is limited to the
        duration for which your application is running.
        - An expired session token cannot be used to start a new session.
        - A session token is specfic to the Basemap Styles service. You cannot use this session token to access other services.

        To learn how to use a basemap session, go to [Mapping and location services > Mapping > Basemap usage](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/basemap-usage-styles/#basemap-sessions-usage-model).
      parameters:
      - $ref: '#/components/parameters/TokenParam'
      - $ref: '#/components/parameters/FormatParam'
      - $ref: '#/components/parameters/StyleFamilyParam'
      - $ref: '#/components/parameters/DurationParam'
      responses:
        '200':
          $ref: '#/components/responses/BasemapSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedErrorResponse'
        '403':
          $ref: '#/components/responses/PermissionMissingErrorResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
components:
  schemas:
    StyleFamily:
      type: string
      description: The family of the style.
      enum:
      - arcgis
      - open
      - osm
      example: arcgis
    StyleGroup:
      description: |
        A group or theme used to describe basemap styles that have a similar purpose.

        A style group can be used to search for styles that meet a particular
        business need or to group related styles in a table of contents or a
        basemap picker app.
      type: string
      enum:
      - streets
      - topography
      - satellite
      - reference
      - creative
      example: streets
    SessionStyleFamily:
      type: string
      description: The family of styles that the session can access. This can be an ArcGIS basemap style family or an Open basemap style family.
      enum:
      - arcgis
      - open
      example: arcgis
    Webmap:
      type: object
      description: |
        Provides a Webmap JSON as defined by the [ESRI ArcGIS Webmap](https://developers.arcgis.com/web-map-specification/) specification.

        Contains a URL pointing to the location of the requested style.
      externalDocs:
        description: ESRI specification for ArcGIS webmaps.
        url: https://developers.arcgis.com/web-map-specification/
    Style:
      type: object
      description: |
        Provides a Style JSON as defined by the [Maplibre Style](https://maplibre.org/maplibre-style-spec/) specification.
      externalDocs:
        description: Maplibre specification for styles.
        url: https://maplibre.org/maplibre-style-spec/
    ServiceSelf:
      type: object
      description: A JSON structure which describes the Basemap Styles Service. Includes a list of all supported languages, worldviews, and places.
      properties:
        name:
          description: Name of the service.
          type: string
          example: Basemap Styles
        version:
          description: Version of the service that you are using.
          type: string
          example: x.x.x
        description:
          description: Description of the service.
          type: string
          example: Brief description of Basemap styles API
        styleFamilies:
          description: |
            A list of the available style families.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the style family.
                type: string
                example: ArcGIS
              code:
                description: Code for the style family.
                type: string
                example: arcgis
        languages:
          description: |
            Supported languages that can be passed to the {?language} parameters.

            To see which languages are available for a style, check its array of `supportedLanguageCodes`.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the language.
                type: string
                example: English
              code:
                description: Code for the language.
                type: string
                example: en
        worldviews:
          description: Supported worldviews that can be passed to the {?worldview} parameter.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the worldview.
                type: string
                example: China
              code:
                description: Code for the worldview.
                type: string
                example: china
        places:
          description: Supported places values that can be passed to the {?places} parameters.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the places parameter.
                type: string
                example: Attributed
              code:
                description: Code for the places parameter.
                type: string
                example: attributed
        selfUrl:
          description: URL that points to self.
          type: string
          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/self
        stylesUrl:
          description: URL that points to styles self.
          type: string
          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/styles/self
        webmapsUrl:
          description: URL that points to webmaps self.
          type: string
          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/webmaps/self
      required:
      - name
      - version
      - description
      - languages
      - worldviews
      - places
      - selfUrl
      - stylesUrl
      - webmapsUrl
    WebmapsSelf:
      type: object
      description: Describes the list of available webmap endpoints.
      properties:
        languages:
          description: |
            The languages supported by all the Webmaps.

            To see which languages are available for a style, check its array of `supportedLanguageCodes`.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the language.
                type: string
                example: English
              code:
                description: Code for the language.
                type: string
                example: en
        worldviews:
          description: Supported worldviews that can be passed to the {?worldview} parameter.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the worldview.
                type: string
                example: China
              code:
                description: Code for the language.
                type: string
                example: china
        places:
          description: Supported places values that can be passed to the {?places} parameters.
          type: array
          items:
            type: object
            properties:
              name:
                description: Name of the places parameter.
                type: string
