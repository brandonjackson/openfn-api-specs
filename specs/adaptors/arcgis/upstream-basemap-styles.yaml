openapi: 3.0.3
info:
  title: Basemap styles service
  description: The basemap styles service provides global basemap layers in a variety of styles to use in mapping applications. Basemap layers give geographic context to a map or scene by serving static tiles containing geographic reference data. This data includes, but is not limited to, topographic features, road networks, footpaths, building footprints, water features, administrative boundaries, and localized language place labels. The JSON structure of a basemap style can be returned as the [Mapbox Style Specification](https://docs.mapbox.com/mapbox-gl-js/style-spec/) or the Esri [Web Map Specification](https://developers.arcgis.com/web-map-specification/).
  version: 2.14.2
  termsOfService: https://developers.arcgis.com/documentation/terms-of-use/
servers:
- url: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/{apiVersion}
  description: Production service endpoint.
  variables:
    apiVersion:
      description: Version 2 of the basemap-styles service.
      default: v2
tags:
- name: webmaps
  description: Endpoints for a given style family, such as [ArcGIS](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/arcgis-styles/) or [Open](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/open-styles/),returned as a _webmap_.
- name: styles
  description: Endpoints for a given style family, such as [ArcGIS](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/arcgis-styles/) or [Open](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/open-styles/), returned as a _style_.
- name: custom-webmaps
  description: Endpoints for [custom basemaps](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/custom-basemap-styles/) that require Portal ID returned as a _webmap_.
- name: custom-styles
  description: Endpoints for [custom basemaps](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/custom-basemap-styles/) that require Portal ID returned as a _style_.
security:
- ArcGISAuthorizationHeader: []
- ArcGISXEsriAuthorizationHeader: []
- ArcGISTokenParameter: []
