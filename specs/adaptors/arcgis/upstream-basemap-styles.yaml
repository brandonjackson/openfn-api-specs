      summary: A web map representation for a custom basemap style for the supplied portal item.
      description: |
        A webmap containing a custom basemap style allows you to share your own unique basemap color scheme to emphasize geographic features and labels or match specific branding.

        To create a new custom basemap style, use the [ArcGIS Vector Tile Style
        Editor](https://www.arcgis.com/apps/vtseditor/en/#/). The editor copies
        an existing style and allows you to start editing the new style. The
        editor provides tools that let you inspect and set the visual properties
        for all of the features and labels in each layer. When you save the
        custom basemap style, a portal item is created which you can share. For
        more information about creating custom basemap styles, see [Custom
        basemap
        styles](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/custom-basemap-styles/).

        Note that the [ArcGIS Vector Tile Style
        Editor](https://www.arcgis.com/apps/vtseditor/en/#/) provides basemap
        tiles served by the ibasemaps-api.arcgis.com and basemaps-api.arcgis.com
        domains. The attribution, minimum and maximum lod, and the tiling scheme
        of these services are always available. If you edit the custom basemap
        style JSON to add different domains, these properties will not be
        present.

        Note that when you make changes to your custom style, it can take up to
        10 minutes for the changes to be available via this endpoint.

        You cannot fetch a custom style with a session token, but if necessary,
        you can fetch the underlying basemap tiles with a session token.
