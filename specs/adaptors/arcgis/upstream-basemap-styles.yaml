          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/webmaps/arcgis/human-geography-dark/base{?language}{?worldview}{?places}
        baseUrl:
          description: URL that points to the base layer self.
          type: string
          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/webmaps/arcgis/human-geography-dark/base/self
        detailUrl:
          description: URL that points to the detail layer self.
          type: string
          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/webmaps/arcgis/human-geography-dark/detail/self
        labelsUrl:
          description: URL that points to the labels layer self.
          type: string
          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/webmaps/arcgis/human-geography-dark/labels/self
        supportedLanguageCodes:
          description: |
            A list of the language codes that are supported for this style.

            You can see the full details of a given language,
            including its display name, in the `languages` property
            of the service's self endpoint.
          type: array
          items:
            type: string
            minItems: 0
            example:
            - fr
            - de
      required:
      - complete
      - name
      - path
      - provider
      - thumbnailUrl
      - selfUrl
      - styleUrl
      - supportedLanguageCodes
    Error:
      type: object
      properties:
        error:
          description: Error information
          type: object
          properties:
            code:
              description: A code identifying the type of error, either an HTTP error code, `498` (signifying invalid or expired token), or `499` (signifying missing token).
              type: integer
              example: 400
              enum:
              - 400
              - 401
              - 403
              - 404
              - 498
              - 499
              - 500
            message:
              description: A message describing the error.
              type: string
              minLength: 1
            details:
              description: List of details about the error.
              type: array
              items:
                type: string
                minItems: 0
            restInfoUrl:
              description: URL that provides the basemap-styles service information.
              type: string
              example: https://basemapstyles-api.arcgis.com/arcgis/rest/info
          required:
          - code
          - message
      required:
      - error
    BasemapSession:
      type: object
      description: |
        The basemap session is a duration of time that users can use a session token to access basemap styles and tiles from this service.

        The basemap session usage model allows ArcGIS Location Platform
        developers to use unlimited ArcGIS basemap tiles for a specific amount
        of time which is the session duration. The maximum duration is 12 hours.
        There is only one usage charge to create the session token and no
        additional usage charges to access individual basemap tiles.
      properties:
        sessionToken:
          description: A session token is a token that can access this service for a set duration of time and for a fixed usage cost.
          type: string
          example: <Session Token>
        endTime:
          description: The time at which the session token expires. It is represented as the number of milliseconds since unix 1970 epoch.
          type: number
          format: int64
          example: 1758067504227
        startTime:
          description: The time at which the session token was created. It is represented as the number of milliseconds since unix 1970 epoch.
          type: number
          format: int64
          example: 1758024304227
        styleFamily:
          description: The family of styles that the session token can be used to access. The styleFamily can be an ArcGIS basemap style family or an Open basemap style family.
          $ref: '#/components/schemas/SessionStyleFamily'
      required:
      - sessionToken
      - endTime
      - startTime
      - styleFamily
