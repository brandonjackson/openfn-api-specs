    TokenParam:
      name: token
      in: query
      description: |
        The authentication token, used to access the Basemap styles service.

        The `token` parameter can be:
        - an API key
        - a short-lived token
        - a session token generated by the `sessions/start` endpoint

        API keys and short-lived tokens must be created from an account with the
        `premium:user:basemaps`
        [privilege](https://developers.arcgis.com/rest/users-groups-and-items/privileges.htm).

        Session tokens must be created from an ArcGIS Location Platform account
        with the `premium:user:basemaps` privilege.

        Note that session tokens cannot be used with the `sessions/start`
        endpoint or to fetch custom styles.

        **Developer guide**: To learn more, go to [Security and
        authentication](https://developers.arcgis.com/documentation/security-and-authentication/).

        This parameter is required _unless_ you supply an access token in the
        request header with one of the following keys using the "Bearer" scheme:

        - `Authorization: Bearer <YOUR_TOKEN>`
        - `X-Esri-Authorization: Bearer <YOUR_TOKEN>`
      schema:
        type: string
