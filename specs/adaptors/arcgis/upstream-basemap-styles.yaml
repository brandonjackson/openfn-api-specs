            For example, the `arcgis/imagery` style includes all of the basemap data required to provide the context for a mapping application and so is considered complete. It is comprised of a base layer of satellite imagery with an overlay of  place name labels and streets.

            By contrast the `arcgis/imagery/labels` style only provides the place names and streets. Without the accompanying satellite imagery this style does not provide a complete basemap.
          type: boolean
          default: true
        path:
          description: Endpoint path used to access the webmap.
          type: string
          example: /styles/arcgis/human-geography-dark
        provider:
          description: Style provider, arcgis or osm.
          type: string
          example: arcgis
        styleFamily:
          description: The family of the style. This can be an ArcGIS basemap style family or an Open basemap style family.
          $ref: '#/components/schemas/StyleFamily'
        group:
          $ref: '#/components/schemas/StyleGroup'
        thumbnailUrl:
          description: Link to thumnail of style.
          type: string
          example: https://www.arcgis.com/sharing/rest/content/items/ea3befe305494bb5b2acd77e1b3135dc/info/thumbnail/thumbnail1659480292164.png
        selfUrl:
          description: URL that points to self.
          type: string
          example: https://basemapstyles-api.arcgis.com/arcgis/rest/services/styles/v2/webmaps/arcgis/human-geography-dark/self
        styleUrl:
          description: URL that refers to a style, potentially including parameters such as language, worldview, or places at the end if they are supported.
          type: string
