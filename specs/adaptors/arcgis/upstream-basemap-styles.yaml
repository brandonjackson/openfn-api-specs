    ItemIDParam:
      name: item_id
      in: path
      required: true
      description: |
        Portal item unique identifier representing a single content item in the ArcGIS portal.

        The portal item must be of [type](https://developers.arcgis.com/rest/users-groups-and-items/items-and-item-types.htm) Tile Layer (based on either a Map Service or Vector Tile Service).
        See [ArcGIS Glossary](https://developers.arcgis.com/documentation/glossary/item-id/) for more
        information about portal item IDs.
        See [ArcGIS item types](https://developers.arcgis.com/rest/users-groups-and-items/items-and-item-types.htm)
        for more information about item types.
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: ^[0-f]*$
      example: be070defddef468b8bf0a43bde321ab5
    PlacesParam:
      name: places
      in: query
      description: |
        Optional, case-sensitive parameter to control the places returned with the style.

        If not set, the default behavior is to display no places, `places=none`.

        | Places | Places Code | Notes                                                                               |
        | ---------- | ------------ | ------------------------------------------------------------------------------ |
        | All        | `all`        | Include all places available with the style.                                   |
        | Attributed | `attributed` | Include all places that have attributes (_esri_place_id_, _name_, _category_). |
        | None       | `none`       | Remove all places from the style.                                              |

        An _esri_place_id_ can be used with the [Places service](https://developers.arcgis.com/rest/places/) to request additional attributes for a place. To learn how to request attributes, go to [`/places/{placeId}`](https://developers.arcgis.com/rest/places/place-id-get/).

        **Developer guide:** To learn more about this workflow, go to [Places for basemaps](https://developers.arcgis.com/documentation/mapping-and-location-services/mapping/basemaps/basemap-places/).
        **Note:** Custom styles can be created from provided styles with places functionality enabled by default by manipulating the JSON in the [Vector Tile Style Editor](https://www.arcgis.com/apps/vtseditor).
      schema:
        type: string
        enum:
        - all
        - attributed
        - none
        example: none
        default: none
    ArcGISWorldviewParam:
      name: worldview
      in: query
      description: |
        Optional, case-sensitive parameter to control the boundary lines and labels displayed with some ArcGIS styles.

        To select a US edition of a basemap style, set the `worldview` parameter
        to `unitedStatesOfAmerica`.

        If the `worldview` parameter is not set, the style will use the standard
        set of boundary lines and labels as defined by the style, rather than
        the specific view of a single country.

        The `worldview` parameter allows you to display an edition of basemap
        borders and labels based on the specific view of a country. Please note
        that it is not that country's international policy outside of their
        country.

        When a specific worldview is chosen, it is possible for some labels to
        change language. However, when the language query parameter is used in
        combination with the worldview selection, the explicitly selected
        language will take priority over any language changes associated with
        the worldview.
      schema:
        type: string
        enum:
        - china
        - india
        - israel
        - japan
        - morocco
        - pakistan
        - southKorea
        - unitedArabEmirates
        - unitedStatesOfAmerica
        - vietnam
      examples:
        china:
          value: china
          summary: |
            Shows boundary lines and labels that correspond to the Chinese view
            of the world boundaries and labels.
        india:
          value: india
          summary: |
            Shows boundary lines and labels that correspond to the Indian view
            of the world boundaries and labels.
    StyleFamilyParam:
      name: styleFamily
      in: query
      description: |
        A style family is the name for a set of styles that use the same set of data providers.

        The `arcgis` style family supports styles that reference data from Esri
        and other authoritative data providers such as TomTom, Garmin, FAO,
        NOAA, USGS, OpenStreetMap (OSM) contributors, and the GIS User
        Community.

        The `open` style family supports styles that reference data from
        Overture Maps and open source data providers such as OpenStreetMap
        (OSM), Microsoft, Esri Community Maps, and other open data sources.
      required: true
      schema:
        type: object
        default: arcgis
        $ref: '#/components/schemas/SessionStyleFamily'
    DurationParam:
      name: durationSeconds
      in: query
      description: |
        An optional parameter to specify the session duration in seconds.

        If not provided, the session will default to 43200 seconds (12 hours).
        Valid range is from 10 to 43200 seconds.

        This parameter allows you to create a session with a duration that is
        shorter than the default session duration of 12 hours. This is useful if
        you want to test your application's behavior when the session token
        expires. A short session duration will allow you to achieve this more
        easily within your application's development lifecycle.

        Note that each session is charged at the same amount regardless of the
        session duration.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 10
        maximum: 43200
        example: 3600
        default: 43200
    EchoTokenParam:
      name: echoToken
      in: query
      description: |
        An optional parameter to control whether the response includes the token to access style resources.

        If the `echoToken` parameter is not provided, the basemap styles
