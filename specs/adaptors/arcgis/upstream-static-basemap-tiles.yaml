openapi: 3.0.3
info:
  title: ArcGIS static basemap tiles service
  description: |
    # ArcGIS static basemap tiles

    The static basemap tiles service gives you access to Esri's
    [ArcGIS](https://developers.arcgis.com/rest/basemap-styles/#arcgis-styles)
    styles as rasterized (.png) basemap tiles.

    The service provides an endpoint to fetch tiles for each supported style
    (for example `/arcgis/streets/static/tile/{level}/{row}/{column}`). To fetch
    a basemap tile for your chosen style, supply the desired level, row and
    column. Note that, in some systems, a tiling scheme is defined by `x`
    (column), `y` (row), `z` (level) which should be arranged as
    `/arcgis/streets/static/tile/{z}/{y}/{x}`.

    Tiles are supplied as 512x512 .png files in a Web Mercator spatial
    reference.

    Each style also has a metadata endpoint (for example
    `/arcgis/streets/static`) that provides details such as the tiling scheme
    and attribution. Basemap attribution is required when building and deploying
    mapping applications that use the [Static basemap tiles
    service](xref://site.rest/static-basemap-tiles/). There are two types of
    attribution that you need to display:

    1. _Powered by Esri_.
    2. Attribution for the data source providers.

    For more details see [Esri and data attribution](https://developers.arcgis.com/documentation/esri-and-data-attribution/).

    To access the service, you must use an ArcGIS Location Platform account to
    create a token that includes the `premium:user:staticbasemaptiles` privilege.
  version: 1.6.1
  termsOfService: https://developers.arcgis.com/documentation/terms-of-use/
