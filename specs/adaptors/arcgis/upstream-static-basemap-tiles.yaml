        '403':
          $ref: '#/components/responses/PermissionMissingErrorResponse'
        5XX:
          $ref: '#/components/responses/ServerErrorResponse'
      operationId: ServiceSelfGet
      x-arcgis-frontmatter:
        keywords:
        - style
        - basemap
        - self
      summary: Describes the static basemap tiles service.
      description: |
        Returns JSON describing the static basemap tiles service.

        This self describing endpoint includes details on supported styles,
        including the name, thumbnail and a list of supported languages and
        worldviews. The information for each style also includes the URLs to be
        used for requesting tiles.

        You can use this information to build a dynamic user interface that
        presents a user with the available selection of basemap styles.
      parameters:
      - $ref: '#/components/parameters/TokenParam'
