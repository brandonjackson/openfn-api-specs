                  #/components/schemas/github.com-mailgun-emailpreview-clients-preview-ClientsResponse
              examples:
                Example:
                  value:
                    clients:
                      android10_gmailapp_pixel4_dm:
                        id: android10_gmailapp_pixel4_dm
                        client: Gmail App Pixel 4
                        os: Android 10 (Dark Mode)
                        category: Mobile
                        browser: ''
                        rotate: false
                        imageblocking: false
                        free: false
                        default: true
                        extension: ''
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericAPIError
        '401':
          description: A 401 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericAPIError
        '500':
          description: A 500 response
