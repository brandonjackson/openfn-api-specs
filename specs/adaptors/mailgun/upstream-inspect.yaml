openapi: 3.1.0
info:
  title: Email Preview API
  description: >-
    Mailgun Email Preview service with RESTful JSON HTTP API for providing email
    previews.
  version: 1.0.0
servers:
  - url: https://api.mailgun.net
    description: US Mailgun
  - url: https://api.eu.mailgun.net
    description: EU Mailgun
tags:
  - name: Email Preview
    description: >-
      This API provides functionality to create and manage email preview tests,
      as well as create shareable links.
    x-displayName: Email Preview
  - name: Code Analysis
    description: >-
      The Code Analysis API analyzes HTML email content to detect CSS features
      and provides comprehensive compatibility reports across major email
      clients, including support statistics, version-specific compatibility
      data, and detailed feature breakdowns to ensure optimal email rendering.
    x-displayName: Code Analysis
  - name: Link Validation
    description: >-
      The Link Validation API processes a list of URLs to verify their HTTP
      status, monitor redirect chains with timing metrics, and provide detailed
      information on content length, content type, and SSL certificate status.
    x-displayName: Link Validation
  - name: Image Validation
    description: >-
      The Image Validation API processes image URLs or uploads to provide
      comprehensive details such as dimensions, type, file size, and format,
      reports frame count, animation duration, color depth, and transparency for
      GIFs, and include image optimization capabilities.
    x-displayName: Image Validation
  - name: Accessibility
    description: >-
      The Accessibility API evaluates HTML emails against WCAG standards,
      providing a clear pass/fail assessment to ensure compliance with
      accessibility guidelines.
    x-displayName: Accessibility
  - name: Spam Testing
    description: >-
      The Spam Testing API scores inbox placement by submitting email content to
      seed accounts across major providers, reporting deliverability, spam
      filter verdicts, and authentication results to help maximize inbox reach.
    x-displayName: Spam Testing
paths:
  /v1/preview/tests/clients:
