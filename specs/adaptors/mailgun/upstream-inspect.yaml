      summary: Get Accessibility Tests
      description: >-
        Retrieve a paginated list of all accessibility tests that have been
        submitted. Each test includes details such as its status, the number of
        checks performed, and, of those checks, how many passes and failures
        there were. The response is paginated, with a limit of up to 1000 items
        per page.  The total count of records will display in the meta object
        under the key, 'count'.
      operationId: GET-v1-inspect-accessibility
      parameters:
        - name: limit
          in: query
          description: 'Max count of items. Max: 1000. Default: 100'
          schema:
            type: integer
        - name: skip
          in: query
          description: >-
            Get the list of items starting at the nth element (paging). Default:
            0
          schema:
            type: integer
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-inspect-internal-accessibility-GetAccessibilityTestsJSONAPIResponse
              examples:
                Example:
                  value:
                    meta:
                      count: 9
