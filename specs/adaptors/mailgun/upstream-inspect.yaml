  /v2/preview/tests:
    get:
      tags:
        - Email Preview
      summary: List/Search Tests V2
      description: >-
        This call returns a list of Email Tests along with metadata about each
        test. Email Tests are stored for 90 days. When query parameters are
        provided, only the tests matching the specified criteria will be
        returned; otherwise, all available tests are returned. The response
        structure remains identical in both cases.
      operationId: GET-v2-preview-tests
      parameters:
        - name: customer_id
          in: query
          description: Filter tests by the provided customer ID.
          schema:
            type: string
        - name: from
          in: query
          description: >-
            The starting point of your test date range. Accepts formats like
            '2025-03-10 17:52:07', Unix timestamp, or 'yesterday'.
          schema:
            type: string
        - name: to
          in: query
          description: >-
            The ending point of your test date range. Accepts formats like
            '2025-03-10 17:52:07', Unix timestamp, or 'yesterday'.
          schema:
            type: string
        - name: subject
          in: query
          description: >-
            The "subject" field of returned tests must contain the exact string.
            This search is case-insensitive.
          schema:
            type: string
        - name: headers
          in: query
          description: >-
            Enterprise users can use this field in a KV array of x-headers
            submitted with the test. This is an AND match, meaning all headers
            must be present to return.
          schema:
            type: string
        - name: results
          in: query
          description: >-
            The number of results to return. Must be between 1 and 200. The
            default value is 50.
          schema:
            type: integer
        - name: page
          in: query
          description: >-
            The page number. If you submit a number higher than the number of
            pages in the data, an empty array will be returned. The default
            value is 1.
          schema:
            type: integer
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-emailpreview-clients-preview-GetTestsResponse
              examples:
                Example:
                  value:
                    - id: DdbNga1MdL3N7sO19v5MAmpOKIqFrLg9cgpCIgS4othXJ
                      date: 1739876826
                      type: email-test
                      subject: subject
                      headers: {}
                    - id: pDdLWjbj3ZbAnHkTbg3QG27mFyoc62OAH1WJXgmb0uNT4
                      date: 1739874606
                      type: email-test
                      subject: ''
                      headers: {}
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericAPIError
        '401':
          description: A 401 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericAPIError
        '500':
          description: A 500 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-emailpreview-clients-preview-ErrorResponse
      security:
        - basicAuth: []
    post:
      tags:
        - Email Preview
      summary: Create Email Preview Test V2
      description: >-
        This call creates a new email test and submits it to our system for
        processing.<br>All requests must contain a subject property and one
        source property (either html or url). All other properties are optional.
        In the following table, each property and its default value is shown.
        <br>If content-checking variables (such as those for link validation,
        image validation, or accessibility) are set in the body of the request,
        the endpoint will run content-checking on the email content. <br>The
        response will include an id property that should be used to request the
        results or trigger further processes on the email content.<br>For
        enterprise customers, the response will also include the customer_id and
        reference_id that were submitted with the test.
      operationId: POST-v2-preview-tests
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/github.com-mailgun-emailpreview-clients-preview-CreateTestRequest
            examples:
              Example:
                value:
                  subject: Example subject
                  html: <html>...</html>
                  transfer_encoding: base64
                  charset: utf-8
                  customer_id: '1'
                  clients:
                    - client1
                    - client2
                  content_checking:
                    link_validation: true
                    image_validation: true
                    accessibility: true
                    code_analysis: true
        required: true
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-emailpreview-clients-preview-CreateTestResponse
              examples:
                Example:
                  value:
                    id: exampleTestID
                    customer_id: '1'
                    warnings:
                      - name: InvalidClient
                        message: >-
                          A client ID you have requested (ipadpro_11_15,
                          ipadpro_12_15, iphonese2_15, iphone11pro_15,
                          iphone12promax_15, iphone13promax_15) could not be
                          found. It may be that the code does not exist or that
                          it is no longer supported.
                    content_checking:
                      link_validation:
                        items:
                          id: 67b469d74b911fa30a4d782e
                          links:
                            self: /v1/inspect/links/67b469d74b911fa30a4d782e
                      image_validation:
                        items:
                          id: 67b469d74b911fa30a4d782e
                          links:
                            self: /v1/inspect/images/67b469d74b911fa30a4d782e
                      accessibility:
                        items:
                          id: 67b469d74b911fa30a4d782e
                          links:
                            self: /v1/inspect/accessibility/67b469d74b911fa30a4d782e
                      code_analysis:
                        items:
                          id: 67b469d74b911fa30a4d782e
                          links:
                            self: /v1/inspect/analyze/67b469d74b911fa30a4d782e
        '400':
          description: A 400 response
          content:
            application/json:
