        subject, submission time (in UNIX timestamp format), processing
        statuses, and any content checking results. The response includes one to
        three properties containing arrays of clients: completed (clients that
        have successfully uploaded screenshots), processing (clients that are
        still being processed by our system), and bounced (clients that were
        bounced by the destination and cannot be retried). Additionally, the
        system will automatically requeue screenshots if they remain in
        processing for more than three minutes.
