  /v4/address/validate/bulk:
    get:
      tags:
        - Bulk Validations
      summary: List Jobs V4
      description: Returns all jobs.
      operationId: api.InitV4API.(*ApiHelpers).isFreeOrFishy.func4-11
      parameters:
        - name: X-Mailgun-Account-Id
          in: header
          description: Mailgun Account ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponse'
              examples:
                Example:
                  value:
                    total: 2
                    jobs:
                      - created_at: 160000001
                        id: some-job-name
                        quantity: 10000
                        records_processed: 3202
                        status: processing
                      - created_at: 160000000
                        download_url:
                          csv: https://some-aws-or-gcp-host/file.csv.zip
                          json: https://some-aws-or-gcp-host/file.json.zip
                        id: some-job-name
                        quantity: 10000
                        status: uploaded
                        summary:
                          engagement: null
                          result:
                            catchall: 10
                            deliverable: 9000
                            donotsend: 30
                            undeliverable: 500
                            unknown: 460
                          risk:
                            high: 30
                            low: 8000
                            medium: 1010
                            unknown: 460
                    paging:
                      prev: >-
                        http://localhost/v4/address/validate/bulk?limit=10&page=prev&pivot=
                      first: >-
                        http://localhost/v4/address/validate/bulk?limit=10&page=first&pivot=
                      last: >-
                        http://localhost/v4/address/validate/bulk?limit=10&page=last&pivot=
                      next: >-
