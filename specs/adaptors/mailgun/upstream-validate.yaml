  /v4/address/validate/bulk/{list_id}:
    post:
      tags:
        - Bulk Validations
      summary: Create Bulk Job
      description: Validate a full list of addresses.
      operationId: POST-v4-address-validate-bulk--list-id-
      parameters:
        - name: list_id
          in: path
          description: the name for the bulk job must be unique.
          required: true
          schema:
            type: string
      requestBody:
        content:
          csv file:
            schema:
              $ref: >-
                #/components/schemas/POST-v4-address-validate-bulk-list_id-csv-file-RequestBody
        required: true
      responses:
        '202':
          description: A 202 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-api-BulkPostResponse
              examples:
                Example:
                  value:
                    id: example_list_id
                    message: The validation job was submitted.
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    get:
      tags:
        - Bulk Validations
      summary: Get Job V4
      description: Gets a selected job by list ID.
      operationId: api.InitV4API.(*ApiHelpers).isFreeOrFishy.func2-9
      parameters:
        - name: list_id
          in: path
          description: The list ID being verified
          required: true
          schema:
            type: string
        - name: X-Mailgun-Account-Id
          in: header
          description: Mailgun Account ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetResponse'
              examples:
                Example:
                  value:
                    quantity: 10000
                    id: some-job-name
                    summary:
                      risk:
                        high: 30
                        low: 8000
                        medium: 1010
                        unknown: 460
                      result:
                        donotsend: 30
                        undeliverable: 500
                        unknown: 460
                        catchall: 10
                        deliverable: 9000
                    download_url:
                      csv: https://some-aws-or-gcp-host/file.csv.zip
                      json: https://some-aws-or-gcp-host/file.json.zip
                    status: uploaded
                    created_at: 160000000
        '404':
          description: A 404 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '500':
          description: A 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
      security:
        - basicAuth: []
    delete:
      tags:
        - Bulk Validations
      summary: Delete Job V4
      description: Cancels a selected job by list ID.
      operationId: api.InitV4API.(*ApiHelpers).isFreeOrFishy.func1-8
      parameters:
        - name: list_id
          in: path
          description: The list ID being verified
          required: true
          schema:
            type: string
        - name: X-Mailgun-Account-Id
          in: header
          description: Mailgun Account ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                Example:
                  value:
                    message: Validation job canceled.
        '404':
          description: A 404 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                Example:
                  value:
                    message: No validation job processing for list
        '409':
          description: A 409 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                Example:
                  value:
                    message: >-
                      The job state is '[bad_state]' and is no longer
                      cancellable
        '500':
          description: A 500 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              examples:
                Example:
                  value:
                    message: Failed to cancel job, please contact support
      security:
        - basicAuth: []
    options:
      summary: Option V4
      description: Returns a 204; used by mailjet
      operationId: api.NoContentCall-6
      parameters:
        - name: list_id
          in: path
          description: The list ID being verified
          required: true
          schema:
            type: string
        - name: X-Mailgun-Account-Id
          in: header
          description: Mailgun Account ID
          required: true
          schema:
            type: string
      responses:
        '204':
          description: A 204 response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/string'
              examples:
                Example: {}
      tags:
        - openapi-bulkvalidations_other
      security:
        - basicAuth: []
  /v4/address/validate/preview/{list_id}:
    get:
      tags:
        - List Health Preview
      summary: Get List Health Preview Job
      description: A single list health preview job by ID.
      operationId: GET-v4-address-validate-preview--list-id-
      parameters:
        - name: list_id
          in: path
          description: The list health preview id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-models-Preview
              examples:
                Example:
                  value:
                    id: SampleList
                    valid: true
                    status: preview_complete
                    quantity: 1
                    created_at: 1234567890
                    summary:
                      result:
                        deliverable: 100
                        do_not_send: 0
                        undeliverable: 0
                        unknown: 0
                      risk:
                        high: 0
                        low: 100
                        medium: 0
                        unknown: 0
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    put:
      tags:
        - List Health Preview
      summary: Promote List Health Preview Job
      description: >-
        A currently running list health preview job can be promoted to a full
        bulk validations job, which will validate all addresses in the list.
      operationId: PUT-v4-address-validate-preview--list-id-
      parameters:
        - name: list_id
          in: path
          description: The list health preview job id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: A 202 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-api-PreviewPostResponse
              examples:
                Example:
                  value:
                    Response:
                      id: example_list_id
                      message: >-
                        The bulk preview job was promoted to a bulk validation
                        job.
                    Status: 202
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    post:
      tags:
        - List Health Preview
      summary: Create a List Health Preview Job
      description: >-
        Start a list health preview job from a list of addresses. We will sample
        the list and run validations on a small percentage.
      operationId: POST-v4-address-validate-preview--list-id-
      parameters:
        - name: list_id
          in: path
          description: The list health preview job id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: A 202 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-api-PreviewPostResponse
              examples:
                Example:
                  value:
                    id: example_list_id
                    message: The validation preview was submitted.
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    delete:
      tags:
        - List Health Preview
      summary: Delete List Health Preview Job
      description: Deletes a single list health previewk job by ID.
      operationId: DELETE-v4-address-validate-preview--list-id-
      parameters:
        - name: list_id
          in: path
          description: The list health preview job id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: A 202 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-api-PreviewPostResponse
              examples:
                Example:
                  value:
                    id: example_list_id
                    message: The bulk preview was deleted.
        default:
