  /v3/address/parse:
    get:
      summary: Parse Addresses
      description: >-
        Parses a list of comma separated addresses and optionally perform light
        weight validation of addresses.
      operationId: GET-v3-address-parse
      parameters:
        - name: addresses
          in: query
          description: The comma separated list of addresses
          required: true
          schema:
            type: string
        - name: syntax_only
          in: query
          description: >-
            Enable/disable light weight validation of each address. Default is
            true
          schema:
            type: boolean
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-validation-V3ParseResponse
              examples:
                Example:
                  value:
                    parsed:
                      - john@wick.com
                      - baba_yaga@wick.com
                    unparseable:
                      - john_wick@yaho.com
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      tags:
        - openapi-validations_other
      security:
        - basicAuth: []
    post:
      summary: Parse Addresses
      description: >-
        Parses a list of comma separated addresses and optionally perform light
