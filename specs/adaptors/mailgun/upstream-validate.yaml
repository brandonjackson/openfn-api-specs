openapi: 3.1.0
info:
  title: Validations Service
  description: >-
    Mailgun Email Validation service with RESTful JSON HTTP API for performing
    email validation. This service also manages list

    and CSV ingestion used in bulk validation processing.
  version: 1.0.0
servers:
  - url: https://api.mailgun.net
    description: US Mailgun
  - url: https://api.eu.mailgun.net
    description: EU Mailgun
tags:
  - name: Bulk Validations
    description: >-
      This API provides functionality to upload and manage bulk validation lists
      and previews.
    x-displayName: Bulk Validations
  - name: Validations
    description: >-
      This API provides functionality to validate single addresses, and managing
      thresholds.
    x-displayName: Validations
  - name: openapi-validations_other
    x-displayName: other
  - name: List Health Preview
    x-displayName: List Health Preview
  - name: openapi-bulkvalidations_other
    x-displayName: other
paths:
  /v3/address/validate:
    get:
      summary: Validate Address V3
      description: A single email address to validate.
      operationId: GET-v3-address-validate
      parameters:
        - name: address
          in: query
          description: The address to be validated
          required: true
          schema:
            type: string
        - name: mailbox_verification
          in: query
          description: Enable/disable mailbox verification, default is false
          schema:
            type: boolean
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-validation-V3Response
              examples:
                Example:
                  value:
                    address: '"Baba Yaga" <john_wick@yaho.com>'
                    did_you_mean: john_wick@yahoo.com
                    mailbox_verification: 'false'
                    parts:
                      display_name: Baba Yaga
                      domain: yaho.com
                      local_part: john_wick
                    reason: No MX records found for domain 'yaho.com'
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      tags:
        - openapi-validations_other
      security:
        - basicAuth: []
    post:
      summary: Validate Address V3
      description: A single email address to validate.
      operationId: POST-v3-address-validate
      parameters:
        - name: address
          in: query
          description: The address to be validated
          required: true
          schema:
            type: string
        - name: mailbox_verification
          in: query
          description: Enable/disable mailbox verification, default is false
          schema:
            type: boolean
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-validations-validation-V3Response
              examples:
                Example:
                  value:
                    address: '"Baba Yaga" <john_wick@yaho.com>'
                    did_you_mean: john_wick@yahoo.com
                    mailbox_verification: 'false'
                    parts:
                      display_name: Baba Yaga
                      domain: yaho.com
                      local_part: john_wick
                    reason: No MX records found for domain 'yaho.com'
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      tags:
        - openapi-validations_other
      security:
        - basicAuth: []
