          in: query
          description: Limits the number of items returned in a request
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Domain_Blocklist_Monitoring_github.com-mailgun-dbl_monitor-internal-api-ListHBLsResp
              examples:
                Example:
                  value:
                    items:
                      - HealthRecord:
                          domain: example.com
                          updated_at: '2023-09-06T18:45:51Z'
                          state: healthy
                        hbl_type: email
                        entity: good@example.com
                        created_at: '0001-01-01T00:00:00Z'
                      - HealthRecord:
                          domain: example.com
                          updated_at: '2023-09-06T18:45:51Z'
                          state: listed
                          listed:
                            - list: hbl.spamhaus.org
                              name: Spamhaus HBL
                              first_seen: '2023-01-02T02:14:27Z'
                              last_seen: '2023-09-06T18:45:51Z'
                              comments:
                                - >-
                                  Listed by HBL, see
                                  https://check.spamhaus.org/query/hash/abc._email
                        hbl_type: email
                        entity: bad@example.com
                        created_at: '0001-01-01T00:00:00Z'
                    paging: {}
        '400':
