  /v4/inbox/tests:
    post:
      tags:
        - Inbox Placement
      summary: Run Inbox Placement Test
      description: >-
        Create and run a new inbox placement test. 


        Either 'html', 'template_name' or 'account_template_name' field should
        be provided.


        'variables' are [Template
        variables](https://documentation.mailgun.com/docs/mailgun/user-manual/sending-messages/send-templates),

        which could be used in html or template.

        You can use next recipient variables inside Template variables, 

        which will be filled for every seed automatically:

        %recipient.first_name%, %recipient.last_name%.
      operationId: POST-v4-inbox-tests
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/Inbox_Placement_Testing_github.com-mailgun-spy-internal-services-tests-PublicCreateTestReq
            examples:
              Example:
                value:
                  from: First Last <mail@example.com>
                  subject: Buy our elephants
                  html: >-
                    <html><body>Hello {{first_name}} {{last_name}}. Visit our
                    new shop at {{address}}. <b>Our elephants are the best.</b>
                    </body></html>
                  template_name: domain-template1
                  account_template_name: account-template1
                  variables:
                    address: 108, Robinson Ave, Richmond
                    first_name: '%recipient.first_name%'
                    last_name: '%recipient.last_name%'
                  seed_list: ibp-123@mailgun.com
                  provider_filter:
                    - gmail.com
                    - hotmail.com
                  sending_ip_pool_id: 12345678901234567890abcd
                  sending_ip: 1.2.3.4
        required: true
      responses:
        '202':
          description: A 202 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Placement_Testing_github.com-mailgun-spy-internal-api-CreateTestResp
              examples:
                Example:
                  value:
                    result_id: uuid4
                    links:
                      results: https://api.mailgun.net/v4/inbox/results/uuid4
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Placement_Testing_github.com-mailgun-scaffold-httpapi-GenericResponse
        '403':
          description: A 403 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Placement_Testing_github.com-mailgun-scaffold-httpapi-GenericResponse
        '404':
          description: A 404 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Placement_Testing_github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
