openapi: 3.1.0
info:
  title: Alerts
  description: >-
    Our alerting solution is centered around two concepts: events and channels.
    The occurrence of an event can be configured to trigger an alert. A channel
    describes the delivery method for an alert. Every configured alert consists
    of an event type / channel pair. This level of granularity allows alerting
    to be configured to your exact preference.
  version: 0.0.1
servers:
  - url: https://api.mailgun.net
    description: US Mailgun
  - url: https://api.eu.mailgun.net
    description: EU Mailgun
tags:
  - name: Alerts
    x-displayName: Alerts
  - name: Domains
    x-displayName: Domains
  - name: IP Blocklist Monitoring
    x-displayName: IP Blocklist Monitoring
  - name: Domain Blocklist Monitoring
    description: >-
      Blocklist Monitoring enables you to keep an eye on your reputation.
      Monitor your domains and HBLs against our curated list of blocklist
      providers to make sure you aren't being blocked.
    x-displayName: Domain Blocklist Monitoring
  - name: Spam Traps Monitoring
    description: >-
      Our spam trap monitoring service surfaces how much of your email is being
      sent to known spam traps.
    x-displayName: Spam Traps Monitoring
  - name: openapi-spamtraps_other
    x-displayName: other
  - name: Inbox Placement
    description: >-
      Inbox Placement testing allows you to see the likely deliverability of
      your email campaigns.
    x-displayName: Inbox Placement
  - name: Email Health Score
    x-displayName: Email Health Score
  - name: DMARC Reports
    description: >-
      DMARC reporting provides valuable insights into your infrastructure,
      helping you identify potential issues like senders, misconfigured email
      servers, or phishing attempts.
    x-displayName: DMARC Reports
  - name: Google Postmaster Tools
    description: This API provides access to Google Postmaster data.
    x-displayName: Google Postmaster Tools
  - name: Microsoft SNDS
    description: This API provides access to Microsoft SNDS data.
    x-displayName: Microsoft SNDS
paths:
  /v1/alerts/events:
    get:
      tags:
        - Alerts
      summary: List events
      description: The current list of events that you can chose to receive alerts for.
      operationId: GET-v1-alerts-events
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-alerts-internal-api-ListAlertsEventsResp
              examples:
                Example:
                  value:
                    events:
                      - ip_listed
                      - ip_delisted
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/settings/events:
    post:
      tags:
        - Alerts
      summary: Add Alert
      description: >-
        Use this endpoint to add new alert settings record. This service
        facilitates notifications (Webhook, Slack, or Email) for both Mailgun
        Optimize and Send Alert threshold breaches.


        ### Webhooks


        This section covers details around consuming alerts via webhooks. If you
        are familiar with Mailgun Send webhooks (which provide status updates on
        individual email deliveries), 

        there is a lot of overlapping similarity, however, there are also a few
        minor nuances to account for.


        #### Securing Webhooks


        HMAC is used to verify the integrity as well as the authenticity of
        received webhooks. To verify the origin of a webhook:


        1. Encode the webhook’s entire POST request body with the HMAC algorithm
        (using your webhook signing key and SHA256 digest mode)

        2. Compare the resulting hexdigest to the signature provided in the POST
        request’s X-Sign header.


        NOTE: If you’re consuming Mailgun Send webhooks, please note that your
        Mailgun Send webhook signing key differs 

        from your Alerts webhook signing key. 

        Your Alerts webhook signing keys, used for both Optimize and Send Alert
        products, are available within the Mailgun Alerts UI.


        #### Webhook URL Validation


        When adding or updating a webhook URL for alerts, we will ensure the
        endpoint is reachable by sending a GET request to the provided URL. If a
        200 response is not returned from your endpoint, the request will be
        rejected and your alert setting will not be saved. We intentionally
        chose to send a GET request instead of a POST when validating URLs so
        that your webhook endpoint does not have to account for test requests.


        Additionally, when a POST request is sent to your webhook URL, if a 2xx
        is not returned, we will attempt retries via an exponential backoff
        strategy for up to ~8 hours. If the max retry count is reached, the
        alert will be disabled and the related alert settings record’s
        disabled_at field will be populated.
      operationId: POST-v1-alerts-settings-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/github.com-mailgun-alerts-internal-api-mutateEventSettingReq
            examples:
              Example:
                value:
                  event_type: ip_listed
                  channel: webhook
                  settings:
                    url: https://yourwebhookurl.com
        required: true
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-alerts-internal-settings-EventSettings
              examples:
                Example:
                  value:
                    id: 00000000-0000-0000-0000-000000000000
                    event_type: ip_listed
                    channel: webhook
                    settings:
                      url: https://yourwebhookurl.com
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        '409':
          description: A 409 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/settings/events/{id}:
    put:
      tags:
        - Alerts
      summary: Update Alert
      description: >-
        Use this endpoint to update an existing alert setting record.


        NOTE: When updating a webhook alert, we will ensure the endpoint is
        reachable by sending a GET request to the provided URL. If a 200
        response is not returned, a 400 will be returned and the alert setting
        update will be rejected.
      operationId: PUT-v1-alerts-settings-events--id-
      parameters:
        - name: id
          in: path
          description: The settings ID.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/github.com-mailgun-alerts-internal-api-mutateEventSettingReq
            examples:
              Example:
                value:
                  event_type: ip_delisted
                  channel: email
                  settings:
                    emails:
                      - recipient-a@example.com
                      - recipient-b@example.com
        required: true
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: settings updated
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        '404':
          description: A 404 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    delete:
      tags:
        - Alerts
      summary: Remove Alert
      operationId: DELETE-v1-alerts-settings-events--id-
      parameters:
        - name: id
          in: path
          description: The settings ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: settings deleted
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/settings:
    get:
      tags:
        - Alerts
      summary: List Alerts
      description: >-
        This endpoint returns a list of all configured alert settings for your
        account.
      operationId: GET-v1-alerts-settings
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-alerts-internal-api-SettingsResponse
              examples:
                Example:
                  value:
                    events:
                      - id: 00000000-0000-0000-0000-000000000000
                        event_type: ip_listed
                        channel: webhook
                        settings:
                          url: https://example.com/delisted_hook
                      - id: 00000000-0000-0000-0000-000000000000
                        event_type: ip_delisted
                        channel: webhook
                        settings:
                          url: https://yourwebhookurl.com
                        disabled_at: '2006-01-02T22:04:05Z'
                      - id: 00000000-0000-0000-0000-000000000000
                        event_type: ip_delisted
                        channel: email
                        settings:
                          emails:
                            - recipient-1@example.com
                            - recipient-2@example.com
                    webhooks: {}
                    slack: {}
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/settings/slack:
    put:
      tags:
        - Alerts
      summary: Update Slack settings
      operationId: PUT-v1-alerts-settings-slack
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/github.com-mailgun-alerts-internal-settings-Slack
        required: true
      responses:
        '204':
          description: A 204 response
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    delete:
      tags:
        - Alerts
      summary: Delete Slack settings
      description: >-
        Delete Slack settings and Slack event settings for the Mailgun account.


        To revoke the Slack access token, use DELETE /v1/alerts/slack/oauth.


        To completely remove the Slack App from Slack Workspace, go into App
        Configuration in Slack.
      operationId: DELETE-v1-alerts-settings-slack
      responses:
        '204':
          description: A 204 response
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/settings/webhooks/signing_key:
    put:
      tags:
        - Alerts
      summary: Reset Webhook Signing Key
      operationId: PUT-v1-alerts-settings-webhooks-signing-key
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-alerts-internal-api-ResetWebhooksSigningKeyResp
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/webhooks/test:
    post:
      tags:
        - Alerts
      summary: Test webhook
      description: Sends test webhook request to specified url with dummy data.
      operationId: POST-v1-alerts-webhooks-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/github.com-mailgun-alerts-internal-api-TestWebhookRequest
            examples:
              Example:
                value:
                  event_type: some-event
                  url: https://some-webhook-url.com/webhook
        required: true
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/email/test:
    post:
      tags:
        - Alerts
      summary: Test message
      description: Sends test message to emails with dummy data.
      operationId: POST-v1-alerts-email-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/github.com-mailgun-alerts-internal-api-TestEmailRequest
            examples:
              Example:
                value:
                  event_type: some-event
                  emails:
                    - email1@example.com
                    - email2@example.com
        required: true
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/slack/test:
    post:
      tags:
        - Alerts
      summary: Test message
      description: Sends test message to slack channels with dummy data.
      operationId: POST-v1-alerts-slack-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/github.com-mailgun-alerts-internal-api-TestSlackRequest
            examples:
              Example:
                value:
                  event_type: some-event
                  channel_ids:
                    - C0123
                    - C0456
        required: true
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/slack/oauth:
    delete:
      tags:
        - Alerts
      summary: Revoke Slack access token
      description: >-
        Revoke Slack access token, delete Slack settings and Slack event
        settings.


        NOTE: All Mailgun accounts connected to the same Slack workspace share
        the same token.


        To completely remove the Slack App from Slack Workspace, go into App
        Configuration in Slack.
      operationId: DELETE-v1-alerts-slack-oauth
      responses:
        '204':
          description: A 204 response
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/alerts/slack/channels/{id}:
    get:
      tags:
        - Alerts
      summary: Get Slack channel
      description: Returns Slack channel.
      operationId: GET-v1-alerts-slack-channels--id-
      parameters:
        - name: id
          in: path
          description: The Slack channel ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-alerts-internal-api-SlackChannel
              examples:
                Example:
                  value:
                    id: C012AB3CD
                    name: general
        '401':
          description: A 401 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: token should have 'xoxb-' prefix
        '403':
          description: A 403 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: 'missing_scope: please reconnect the Slack App'
        '404':
          description: A 404 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: no settings
      security:
        - basicAuth: []
  /v1/alerts/slack/channels:
    get:
      tags:
        - Alerts
      summary: List Slack channels
      description: List Slack channels for the connected Slack workspace.
      operationId: GET-v1-alerts-slack-channels
      parameters:
        - name: page
          in: query
          description: Encoded paging information, provided via 'next', 'first' links
          schema:
            type: string
        - name: limit
          in: query
          description: Limits the number of items returned in a request
          schema:
            type: integer
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-alerts-internal-api-ListSlackChannelsResp
              examples:
                Example:
                  value:
                    items:
                      - id: C012AB3CD
                        name: general
                    paging:
                      first: >-
                        https://api.mailgun.net/v1/alerts/slack/channels?page=foo
                      next: >-
                        https://api.mailgun.net/v1/alerts/slack/channels?page=bar
        '401':
          description: A 401 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: token should have 'xoxb-' prefix
        '403':
          description: A 403 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: 'missing_scope: please reconnect the Slack App'
        '404':
          description: A 404 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/github.com-mailgun-scaffold-httpapi-GenericResponse
              examples:
                Example:
                  value:
                    message: no settings
      security:
        - basicAuth: []
  /v1/inboxready/domains:
    get:
      tags:
        - Domains
      summary: Returns Domains on Mailgun Optimize services
      description: >-
        Will return details on an Mailgun Optimize Domain. If no Domain is
        provided, then a list of all Mailgun Optimize Domains on an account will
        be returned.
      operationId: GET-v1-inboxready-domains
      parameters:
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
        - name: domain
          in: query
          description: Domain name
          schema:
            type: string
        - name: include_subaccounts
          in: query
          description: Include subaccounts
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-inboxready-api-DomainListResponse
              examples:
                Example:
                  value:
                    items:
                      - acid: mg_account:123
                        name: domain.tld
                        verified:
                          verified_at: 123456789
                          status: pending
                        services:
                          service_name: false
                        txt_record: IR-hashed-txt-record-key
                    paging:
                      previous: https://....
                      first: https://....
                      next: https://....
                      last: https://....
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    post:
      tags:
        - Domains
      summary: Add a single domain to an account
      operationId: POST-v1-inboxready-domains
      parameters:
        - name: domain
          in: query
          description: Domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-inboxready-api-AddDomainResponse
              examples:
                Example:
                  value:
                    message: The domain has been added
                    domain:
                      acid: mg_account:123
                      name: domain.tld
                      verified:
                        verified_at: 123456789
                        status: pending
                      services:
                        service_name: false
                      txt_record: IR-hashed-txt-record-key
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
    delete:
      tags:
        - Domains
      summary: Deletes a single domain from an account
      operationId: DELETE-v1-inboxready-domains
      parameters:
        - name: domain
          in: query
          description: Domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-inboxready-api-DeleteDomainResponse
              examples:
                Example:
                  value:
                    message: domain.tld has been removed from Mailgun Optimize
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/inboxready/domains/verify:
    put:
      tags:
        - Domains
      summary: Queues a domain to be processed for verification
      operationId: PUT-v1-inboxready-domains-verify
      parameters:
        - name: domain
          in: query
          description: Domain name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-inboxready-api-InboxReadyVerifyDomainResponse
              examples:
                Example:
                  value:
                    message: Domain pending verification
        '400':
          description: A 400 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-inboxready-api-InboxReadyVerifyDomainResponse
              examples:
                Example:
                  value:
                    message: No domain provided
        '404':
          description: A 404 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-inboxready-api-InboxReadyVerifyDomainResponse
              examples:
                Example:
                  value:
                    message: Domain not found
        default:
          description: A default response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-scaffold-httpapi-GenericResponse
      security:
        - basicAuth: []
  /v1/inboxready/ip_addresses:
    get:
      tags:
        - IP Blocklist Monitoring
      summary: Lists monitored IP addresses
      operationId: GET-v1-inboxready-ip-addresses
      parameters:
        - name: limit
          in: query
          description: Limit
          schema:
            type: integer
            default: 100
        - name: include_subaccounts
          in: query
          description: Include subaccounts
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Inbox_Ready_github.com-mailgun-inboxready-api-ListIPAddressesResp
              examples:
                Example:
                  value:
                    items:
                      - ip: 127.0.0.1
