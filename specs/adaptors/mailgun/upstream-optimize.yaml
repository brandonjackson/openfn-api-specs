  /v1/maverick-score/grouped:
    get:
      tags:
        - Email Health Score
      summary: >-
        List Email Health score and rates grouped by
        domains/ips/subaccounts/timestamps
      operationId: GET-v1-maverick-score-grouped
      parameters:
        - name: include_subaccounts
          in: query
          description: Include subaccounts
          required: false
          schema:
            type: boolean
            default: true
        - name: skip
          in: query
          description: Skips N items in a response.
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Limits the number of items returned in a response.
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 10
        - name: group
          in: query
          description: The key to group score by.
          required: false
          schema:
            type: string
            enum:
              - domain
              - ip
              - subaccount
              - timestamp
            default: domain
            x-enumDescriptions:
              domain: Group by domain
              ip: Group by IP
              subaccount: Group by subaccount
              timestamp: Group by timestamp in 'YYYY-MM-DD' format
        - name: term
          in: query
          description: >-
            Filter (exact match) by account_id/domain/ip, e.g.:
            'domain:example.com'
          required: false
          schema:
            type: array
            items:
              type: string
        - name: query
          in: query
          description: 'Query filter (fuzzy), e.g.: ''domain:example.com'''
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: >-
            Supports the following syntax 'sort=field:direction'. 'direction'
            must be one of asc, desc. Default 'direction' is asc.
          required: false
          schema:
            type: string
            enum:
              - domain:asc
              - domain:desc
              - ip:asc
              - ip:desc
              - subaccount:asc
              - subaccount:desc
              - timestamp:asc
              - timestamp:desc
              - score:asc
              - score:desc
              - bounce_rate:asc
              - bounce_rate:desc
              - complaint_rate:asc
              - complaint_rate:desc
              - trap_rate:asc
              - trap_rate:desc
              - full_mailbox_rate:asc
              - full_mailbox_rate:desc
              - bad_failure_rate:asc
              - bad_failure_rate:desc
              - delivered:asc
              - delivered:desc
            x-enumDescriptions:
              domain:asc: domain:asc
              domain:desc: domain:desc
              ip:asc: ip:asc
              ip:desc: ip:desc
              subaccount:asc: subaccount:asc
              subaccount:desc: subaccount:desc
              timestamp:asc: timestamp:asc
              timestamp:desc: timestamp:desc
              score:asc: score:asc
              score:desc: score:desc
              bounce_rate:asc: bounce_rate:asc
              bounce_rate:desc: bounce_rate:desc
              complaint_rate:asc: complaint_rate:asc
              complaint_rate:desc: complaint_rate:desc
              trap_rate:asc: trap_rate:asc
              trap_rate:desc: trap_rate:desc
              full_mailbox_rate:asc: full_mailbox_rate:asc
              full_mailbox_rate:desc: full_mailbox_rate:desc
              bad_failure_rate:asc: bad_failure_rate:asc
              bad_failure_rate:desc: bad_failure_rate:desc
              delivered:asc: delivered:asc
              delivered:desc: delivered:desc
      responses:
        '200':
          description: A 200 response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/Maverick_Score_github.com-mailgun-maverick-score-internal-api-ListScoreResp
              examples:
                Example:
                  value:
                    items:
                      - group_key: a.example.com
                        score: 37
                        rates:
                          bounce_rate: 9
                          complaint_rate: 19
                          trap_rate: 3
                          full_mailbox_rate: 3
                          bad_failure_rate: 29
                        counters:
                          delivered: 100500
                    total: 1
        '403':
          description: A 403 response
