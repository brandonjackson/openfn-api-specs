      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DMARC_Reports_ReferReq'
  responses:
    DMARC_Reports_records_200:
      description: OK | The records for DMARC DNS Setup
      content:
        application/json:
          example:
            entry: >-
              v=DMARC1; p=none; pct=100; fo=1; ri=3600;
              rua=mailto:abcdef12@inbox.ondmarc.com;
              ruf=mailto:abcdef12@inbox.ondmarc.com;
            current: >-
              v=DMARC1; p=none; pct=100; fo=1; ri=3600;
              rua=mailto:abcdef12@inbox.ondmarc.com;
              ruf=mailto:abcdef12@inbox.ondmarc.com;
            configured: true
