  parameters:
    DMARC_Reports_fromParam:
      in: query
      name: from
      description: UNIX epoch (UTC seconds) representing the start of the time range.
      required: false
      schema:
        type: integer
      example: 1736790000
    DMARC_Reports_toParam:
      in: query
      name: to
      description: >-
        UNIX epoch (UTC seconds) representing the end of the time range. If
        supplied, `from` must also be set.
      required: false
      schema:
        type: integer
      example: 1736790285
    DMARC_Reports_host:
      required: true
      in: path
      name: host
      schema:
        type: string
      description: Host name
      example: mx.mailgun.com
    DMARC_Reports_ip:
      in: path
      name: ip
      required: true
      schema:
        type: string
      description: a valid IPv4 or IPv6 address
      example: 8.8.8.8
    DMARC_Reports_domain:
      in: path
      name: domain
      schema:
        type: string
      description: Fully qualified domain name
      required: true
      example: example.com
    DMARC_Reports_source:
      in: path
      name: source
      schema:
        type: string
      description: User friendly source id name
      example: mailgun
      required: true
