            provided, too
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: >-
            Sort order as comma-separated `field[:asc|desc]` items, the
            direction defaults to `asc`. Allowed fields: `state,entity`,
            `state,domain,entity`. E.g. `state:desc,entity:asc`
          required: false
          schema:
            type: string
        - name: include_subaccounts
          in: query
          description: Include subaccounts
          required: false
          schema:
            type: boolean
            default: false
